<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3768">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="google-site-verification" content="{{GOOGLE_SITE_VERIFICATION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_ZM">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:url" content="{{PAGE_URL}}">
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="wordmark">KICKS <span class="amp">&amp;</span> JEANS</a>
    <nav class="nav-links">
      <a href="/">Store</a>
    </nav>
    <div></div>
  </div>
</header>

<main class="container track-page">
  <h1>Track Your Order</h1>
  <p class="track-intro">Enter your order code and the phone number used at checkout.</p>

  <form id="trackForm" class="track-form">
    <div class="field">
      <label for="orderCode">Order code</label>
      <input type="text" id="orderCode" placeholder="KJ-XXXXXX" required autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;">
    </div>
    <div class="field">
      <label for="orderPhone">Phone number</label>
      <input type="tel" id="orderPhone" placeholder="097XXXXXXX" required autocomplete="tel">
    </div>
    <div class="error-text" id="trackError" style="display:none;"></div>
    <button type="submit" class="btn-primary" id="trackBtn">Track Order</button>
  </form>

  <div id="orderResult" aria-live="polite"></div>
</main>

<footer class="footer">
  Kicks & Jeans · Delivering across Zambia · Payments via MTN &amp; Airtel Mobile Money · <a href="/admin">Admin</a>
</footer>

<script src="/js/track.js" defer></script>
</body>
</html>
